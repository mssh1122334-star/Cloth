          @keyframes float {

          /* সবুজ বর্ণের 'abcd' falling animation-এর জন্য */

          .falling-letter {

            opacity: 0.6;
            animation: fall linear infinite;

          @keyframes fall {
            0% {

            }
            5% {

            }
            95% {

            }
            100% {
